    <text x="1052" y="282" text-anchor="middle" font-family="JetBrains Mono, Menlo, Courier New, monospace" font-size="11" font-weight="500" letter-spacing="0.8" fill="#2B5CFF">18 KHZ</text>

    <rect x="842" y="304" width="254" height="72" fill="#F5F5F3" stroke="#E3E3DF" stroke-width="1"/>
    <g fill="#2B5CFF">
