  <rect x="72" y="452" width="196" height="44" fill="#2B5CFF"/>
  <text x="170" y="480" text-anchor="middle" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#FFFFFF">Start a pilot</text>

  <!-- app frame -->
  <g>
    <rect x="826" y="158" width="286" height="300" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="1.5"/>
