<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#FFFFFF"/>

  <!-- hairlines -->
  <g stroke="#E3E3DF" stroke-width="1">
    <path d="M0 118 H1200"/>
    <path d="M0 512 H1200"/>
    <path d="M760 118 V512"/>
  </g>

  <!-- logo -->
  <rect x="72" y="36" width="46" height="46" fill="#0A0A0A"/>
  <g transform="translate(79 42)" fill="#FFFFFF">
    <path fill-rule="evenodd" d="M1.3 19.6C5.6 10.8 11.2 7.6 15.2 12.9l.8 1.05.8-1.05c4-5.3 9.6-2.1 13.9 6.7.35.75-.5 1.5-1.15.95-4.3-3.6-8.3-4.1-11-1.4l-2.1 2.1c-.25.25-.65.25-.9 0l-2.1-2.1c-2.7-2.7-6.7-2.2-11 1.4-.65.55-1.5-.2-1.15-.95Z"/>
  </g>
  <text x="132" y="70" font-family="Inter Tight, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="-1" fill="#0A0A0A">Pigeon<tspan fill="#2B5CFF">X</tspan></text>

  <text x="1128" y="70" text-anchor="end" font-family="JetBrains Mono, Menlo, Courier New, monospace" font-size="15" font-weight="500" letter-spacing="1.2" fill="#5F5F5F">SOUND BASED BIRD DETERRENCE</text>

  <!-- headline -->
  <g font-family="Inter Tight, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="68" font-weight="700" letter-spacing="-2" fill="#0A0A0A">
    <text x="72" y="238">Bird control you</text>
    <text x="72" y="308">run from your phone.</text>
  </g>

  <text x="72" y="388" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="25" fill="#1F1F1F">Pick a profile, route it to your speakers</text>
  <text x="72" y="424" font-family="Inter, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="25" fill="#1F1F1F">or our emitters, schedule it around service.</text>

