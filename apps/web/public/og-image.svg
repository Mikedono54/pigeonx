    <text x="1084" y="236" text-anchor="end" font-family="JetBrains Mono, Menlo, Courier New, monospace" font-size="13" font-weight="500" fill="#0F8A4B">12:40</text>

    <rect x="842" y="258" width="254" height="38" fill="#FFFFFF" stroke="#E3E3DF" stroke-width="1"/>
