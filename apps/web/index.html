<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="color-scheme" content="light" />

    <title>PigeonX: bird control you run from your phone</title>
    <meta
      name="description"
      content="PigeonX turns a phone into the controller for sound based bird deterrence. Pick a profile, route it to your speakers or our emitters, schedule it around service, and see what changed."
    />
    <link rel="canonical" href="https://pigeonx.org/" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PigeonX" />
    <meta property="og:title" content="PigeonX: bird control you run from your phone" />
    <meta
      property="og:description"
      content="Pick a profile, route it to your speakers or our emitters, schedule it around service. Built for restaurants, hotels, rooftops and patios."
    />
    <meta property="og:url" content="https://pigeonx.org/" />
    <meta property="og:image" content="https://pigeonx.org/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="PigeonX wordmark above the headline: bird control you run from your phone."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PigeonX: bird control you run from your phone" />
    <meta
      name="twitter:description"
      content="Pick a profile, route it to your speakers or our emitters, schedule it around service. Built for restaurants, hotels, rooftops and patios."
    />
    <meta name="twitter:image" content="https://pigeonx.org/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "PigeonX",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "iOS, Android, Web",
        "url": "https://pigeonx.org/",
        "description": "PigeonX is a sound based bird deterrence platform: a mobile control app, connected emitters, and a commercial dashboard for restaurants, hotels, rooftops and patios.",
        "offers": [
          { "@type": "Offer", "name": "Free", "price": "0", "priceCurrency": "USD" },
          { "@type": "Offer", "name": "Pro", "price": "4.99", "priceCurrency": "USD" },
          { "@type": "Offer", "name": "Business", "price": "29.00", "priceCurrency": "USD" }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Static form definitions so the Netlify build bot can detect them in an SPA. -->
    <form name="pilot" netlify netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="pilot" />
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="text" name="business" />
      <input type="email" name="email" />
      <input type="text" name="city" />
      <input type="text" name="property-type" />
      <textarea name="message"></textarea>
    </form>
    <form name="waitlist" netlify netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="waitlist" />
      <input type="text" name="bot-field" />
      <input type="email" name="email" />
    </form>
  </body>
</html>
